services:
  postgres:
    image: postgres:16-alpine
    profiles: [web]
    environment:
      POSTGRES_DB: courseworkbot
      POSTGRES_USER: courseworkbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseworkbot -d courseworkbot"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  bot:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_PATH: /data/bot_database.db
    depends_on:
      postgres:
        condition: service_healthy

  site:
    build: .
    profiles: [web]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_PATH: /data/bot_database.db
      ENVIRONMENT: production
      WEB_COOKIE_SECURE: "1"
    command:
      - python
      - -m
      - uvicorn
      - repair_bot.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - bot_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
