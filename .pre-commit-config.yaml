default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff static checks
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: Pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
