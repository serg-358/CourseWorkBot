services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/bot_database.db
    volumes:
      - bot_data:/data
    restart: unless-stopped

  site:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/bot_database.db
      ENVIRONMENT: production
      WEB_COOKIE_SECURE: "1"
    command: ["python", "-m", "uvicorn", "repair_bot.web.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - bot_data:/data
    restart: unless-stopped

volumes:
  bot_data:
